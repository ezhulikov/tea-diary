<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>t.element</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root{--bg:#ffffff;--card:#fff;--ink:#2b2b2b;--muted:#8f8f8f;--accent:#464646;--accent-h:#3a3a3a;--accent2:#2b2b2b;--line:#efefef;--radius:4px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:76px}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center}.logo img{height:30px;display:block}
  .logo b{display:inline-flex;width:30px;height:30px;border:2px solid var(--ink);align-items:center;justify-content:center;font-size:18px;font-weight:600}
  .langs{display:flex;gap:4px}
  .langs button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:5px 9px;font-size:13px;color:var(--muted);cursor:pointer}
  .langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:8px 20px;flex:1}
  h1{font-size:28px;font-weight:700;margin:14px 0 16px;letter-spacing:-.3px}
  h2{font-size:17px;margin:22px 0 10px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--line);margin-bottom:14px}
  .points{background:var(--ink);color:#fff;border-color:var(--ink)}
  .points .big{font-size:44px;font-weight:700;line-height:1.1}
  .points .sub{opacity:.8;font-size:14px}
  .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin:14px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;background:#fff;border-radius:4px}
  .qr{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .qr .box{background:#fff;padding:10px;border-radius:12px}
  .muted{color:var(--muted);font-size:14px}
  .btn{display:block;width:100%;border:0;border-radius:4px;padding:14px;font-size:15px;font-weight:500;font-family:inherit;background:var(--accent);color:#fff;cursor:pointer}
  .btn:active{background:var(--accent-h)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
  .btn:disabled{opacity:.4;cursor:default}
  input{width:100%;padding:14px;border-radius:4px;font-family:inherit;border:1px solid var(--line);font-size:17px;margin:8px 0 14px;background:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:4px;background:#efefef;color:#464646}
  .event .date{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .event h3,.tea h3,.reward h3{font-size:17px;margin:4px 0}
  .tea .ru{font-size:13px;color:var(--muted)}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;border:0;background:transparent;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .ic{font-size:21px}
  nav button.on{color:var(--accent);font-weight:600}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .proto{font-size:11px;text-align:center;color:var(--muted);padding:6px 20px 0}
  .login{min-height:calc(100dvh - 200px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 6px}
  .login .mark{width:120px;margin:0 auto 26px;display:block}
  .login h1{font-size:22px;margin:0 0 8px}
  .login p{margin-bottom:22px}
  .login input{text-align:center;font-size:20px;letter-spacing:1px}
  body.out header .logo{visibility:hidden}
  .history div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .history div:last-child{border:0}
  .plus{color:#00a901;font-weight:600}.minus{color:#ab2e31;font-weight:600}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><img src="assets/logo-horizontal.png" alt="t.element"></div>
    <div class="langs" id="langs"></div>
  </header>
  <div class="proto" data-t="proto"></div>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div class="toast" id="toast"></div>
</div>
<script>
const T={
 ru:{proto:"Прототип. Данные выдуманные и хранятся только на этом телефоне.",
  welcome:"Добро пожаловать в t.element",login_hint:"Войдите по номеру телефона. Баллы и записи привяжутся к нему.",phone:"Номер телефона",get_code:"Получить код",code:"Код из SMS",code_hint:"В прототипе подойдёт любой код из 4 цифр.",enter:"Войти",
  home:"Главная",rewards:"Баллы",events:"Афиша",teas:"Новинки",
  hello:"Привет",your_points:"Ваши баллы",to_next:"До бесплатного напитка",pts:"баллов",show_qr:"Покажите этот код на кассе",qr_hint:"Кассир отсканирует его, и баллы начислятся за покупку.",
  sim:"Имитация покупки (для демонстрации)",sim_btn:"Купить напиток за 350 дин",earned:"Начислено",
  rule:"10 баллов за каждые 100 динаров. Баллы можно обменять на напитки.",
  redeem:"Обменять",not_enough:"Не хватает баллов",redeemed:"Готово! Покажите экран на кассе и получите",history:"История",
  seats_left:"Свободно мест",of:"из",signup:"Записаться",cancel:"Отменить запись",signed:"Вы записаны",full:"Мест нет",pay_cash:"Оплата на месте",signed_ok:"Вы записаны. Ждём вас!",cancel_ok:"Запись отменена, место освободилось.",
  new_in:"Новое на полках",notify:"Сообщить о новинках",notify_on:"Уведомления включены",logout:"Выйти",
  purchase:"Покупка",reward:"Обмен"},
 sr:{proto:"Prototip. Podaci su izmišljeni i čuvaju se samo na ovom telefonu.",
  welcome:"Dobro došli u t.element",login_hint:"Prijavite se brojem telefona. Bodovi i prijave biće vezani za njega.",phone:"Broj telefona",get_code:"Pošalji kod",code:"Kod iz SMS-a",code_hint:"U prototipu važi bilo koji kod od 4 cifre.",enter:"Prijavi se",
  home:"Početna",rewards:"Bodovi",events:"Događaji",teas:"Novo",
  hello:"Zdravo",your_points:"Vaši bodovi",to_next:"Do besplatnog pića",pts:"bodova",show_qr:"Pokažite ovaj kod na kasi",qr_hint:"Kasir će ga skenirati i bodovi će biti dodati za kupovinu.",
  sim:"Simulacija kupovine (za demonstraciju)",sim_btn:"Kupi piće za 350 din",earned:"Dodato",
  rule:"10 bodova na svakih 100 dinara. Bodove možete zameniti za piće.",
  redeem:"Zameni",not_enough:"Nedovoljno bodova",redeemed:"Gotovo! Pokažite ekran na kasi i preuzmite",history:"Istorija",
  seats_left:"Slobodnih mesta",of:"od",signup:"Prijavi se",cancel:"Otkaži prijavu",signed:"Prijavljeni ste",full:"Nema mesta",pay_cash:"Plaćanje na licu mesta",signed_ok:"Prijavljeni ste. Vidimo se!",cancel_ok:"Prijava je otkazana, mesto je slobodno.",
  new_in:"Novo na policama",notify:"Obavesti me o novitetima",notify_on:"Obaveštenja uključena",logout:"Odjavi se",
  purchase:"Kupovina",reward:"Zamena"},
 en:{proto:"Prototype. The data is made up and stays on this phone only.",
  welcome:"Welcome to t.element",login_hint:"Sign in with your phone number. Points and bookings will be linked to it.",phone:"Phone number",get_code:"Get code",code:"SMS code",code_hint:"In the prototype any 4 digit code works.",enter:"Sign in",
  home:"Home",rewards:"Points",events:"Events",teas:"New",
  hello:"Hi",your_points:"Your points",to_next:"Until a free drink",pts:"points",show_qr:"Show this code at the counter",qr_hint:"The cashier scans it and you get points for the purchase.",
  sim:"Purchase simulation (demo only)",sim_btn:"Buy a drink for 350 RSD",earned:"Earned",
  rule:"10 points for every 100 dinars. Swap points for drinks.",
  redeem:"Redeem",not_enough:"Not enough points",redeemed:"Done! Show this screen at the counter to get",history:"History",
  seats_left:"Seats left",of:"of",signup:"Sign up",cancel:"Cancel booking",signed:"You're booked",full:"Fully booked",pay_cash:"Pay on site",signed_ok:"You're booked. See you there!",cancel_ok:"Booking cancelled, the seat is free again.",
  new_in:"New on the shelves",notify:"Notify me about new teas",notify_on:"Notifications on",logout:"Sign out",
  purchase:"Purchase",reward:"Reward"}
};
const REWARDS=[
 {id:"tea",cost:150,name:{ru:"Чай в чайнике на одного",sr:"Čaj u čajniku za jednog",en:"Pot of tea for one"}},
 {id:"matcha",cost:250,name:{ru:"Матча латте",sr:"Matcha latte",en:"Matcha latte"}},
 {id:"cer",cost:400,name:{ru:"Чайная церемония на двоих",sr:"Čajna ceremonija za dvoje",en:"Tea ceremony for two"}}
];
const EVENTS=[
 {id:"e1",date:{ru:"Пт, 14 ноября, 19:00",sr:"Pet, 14. novembar, 19:00",en:"Fri, Nov 14, 19:00"},title:{ru:"Дегустация юньнаньских красных чаёв",sr:"Degustacija crvenih čajeva iz Junana",en:"Yunnan red tea tasting"},price:"1200 din",seats:10,taken:6},
 {id:"e2",date:{ru:"Сб, 22 ноября, 17:00",sr:"Sub, 22. novembar, 17:00",en:"Sat, Nov 22, 17:00"},title:{ru:"Мастер-класс: гунфу ча для начинающих",sr:"Radionica: gongfu ča za početnike",en:"Workshop: gongfu cha for beginners"},price:"1500 din",seats:8,taken:8},
 {id:"e3",date:{ru:"Вс, 30 ноября, 18:00",sr:"Ned, 30. novembar, 18:00",en:"Sun, Nov 30, 18:00"},title:{ru:"Вечер пуэров и живой музыки",sr:"Veče puera i žive muzike",en:"Puer and live music evening"},price:"1000 din",seats:14,taken:3}
];
const TEAS=[
 {name:"Ma Tai Lao Shu Jin Ya",ru:"Ма Тай Лао Шу Цзинь Я",type:{ru:"красный",sr:"crveni",en:"red"}},
 {name:"Fei Zi Xiao",ru:"Фэй Цзы Сяо",type:{ru:"красный",sr:"crveni",en:"red"}},
 {name:"Hei Cha",ru:"Хэй Ча",type:{ru:"тёмный чай",sr:"tamni čaj",en:"dark tea"}},
 {name:"Bai Lin Gong Fu Hong Cha",ru:"Байлинь Гунфу Хун Ча",type:{ru:"красный",sr:"crveni",en:"red"}},
 {name:"Alishan Jin Xuan",ru:"Алишань Цзинь Сюань",type:{ru:"улун",sr:"ulong",en:"oolong"}}
];
const KEY="telement_proto_v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{lang:"ru",phone:null,points:120,booked:{},notify:false,history:[{k:"purchase",v:120,d:"03.11"}],tab:"home",step:"phone"};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const t=k=>T[S.lang][k];
const L=o=>o[S.lang];
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200)}
function langs(){document.getElementById("langs").innerHTML=["ru","sr","en"].map(l=>`<button class="${S.lang==l?"on":""}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join("");document.documentElement.lang=S.lang;document.querySelector('[data-t=proto]').textContent=t("proto")}
function setLang(l){S.lang=l;save();render()}
function nav(){const n=document.getElementById("nav");if(!S.phone){n.style.display="none";return}n.style.display="flex";
 const items=[["home","☗"],["rewards","★"],["events","◷"],["teas","❦"]];
 n.innerHTML=items.map(([k,i])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')"><span class="ic">${i}</span>${t(k)}</button>`).join("")}
function go(k){S.tab=k;save();render();window.scrollTo(0,0)}
function qrSVG(text){if(typeof qrcode==="undefined")return `<div class="muted">QR</div>`;const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag(5,0)}
function nextGoal(){const c=REWARDS.map(r=>r.cost).find(c=>c>S.points)||REWARDS[REWARDS.length-1].cost;return c}
const V={
 login(){
  const top=`<img class="mark" src="assets/logo-square.png" alt="t.element">`;
  if(S.step=="phone")return `<div class="login">${top}<h1>${t("welcome")}</h1><p class="muted">${t("login_hint")}</p>
   <input id="ph" type="tel" placeholder="+381 6x xxx xxxx" value="+381 ">
   <button class="btn" onclick="sendCode()">${t("get_code")}</button></div>`;
  return `<div class="login">${top}<h1>${t("code")}</h1><p class="muted">${t("code_hint")}</p>
   <input id="cd" inputmode="numeric" maxlength="4" placeholder="••••">
   <button class="btn" onclick="checkCode()">${t("enter")}</button></div>`},
 home(){const goal=nextGoal(),pct=Math.min(100,Math.round(S.points/goal*100));
  return `<h1>${t("hello")}!</h1>
  <div class="card points"><div class="sub">${t("your_points")}</div><div class="big">${S.points}</div>
   <div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${t("to_next")}: ${Math.max(0,goal-S.points)} ${t("pts")}</div></div>
  <div class="card qr"><div class="box">${qrSVG("TELEMENT:"+S.phone)}</div><b>${t("show_qr")}</b><span class="muted">${t("qr_hint")}</span></div>
  <div class="card"><div class="muted" style="margin-bottom:10px">${t("sim")}</div><button class="btn ghost" onclick="buy()">${t("sim_btn")}</button></div>
  <p class="muted" style="text-align:center;margin:16px 0"><a href="#" onclick="logout();return false" style="color:var(--muted)">${t("logout")}</a></p>`},
 rewards(){return `<h1>${t("rewards")}: ${S.points}</h1><p class="muted" style="margin-bottom:14px">${t("rule")}</p>`+
  REWARDS.map(r=>`<div class="card reward row"><div><h3>${L(r.name)}</h3><span class="pill">${r.cost} ${t("pts")}</span></div>
   <button class="btn small" ${S.points<r.cost?"disabled":""} onclick="redeem('${r.id}')">${S.points<r.cost?t("not_enough"):t("redeem")}</button></div>`).join("")+
  `<h2>${t("history")}</h2><div class="card history">${S.history.slice().reverse().map(h=>`<div><span>${h.d} · ${t(h.k)}</span><span class="${h.v>0?"plus":"minus"}">${h.v>0?"+":""}${h.v}</span></div>`).join("")}</div>`},
 events(){return `<h1>${t("events")}</h1>`+EVENTS.map(e=>{const mine=!!S.booked[e.id],taken=e.taken+(mine?1:0),left=e.seats-taken;
  return `<div class="card event"><div class="date">${L(e.date)}</div><h3>${L(e.title)}</h3>
   <div class="row" style="margin:8px 0 12px"><span class="muted">${t("seats_left")}: ${left} ${t("of")} ${e.seats}</span><span class="pill">${e.price} · ${t("pay_cash")}</span></div>
   ${mine?`<div class="row"><b style="color:var(--ink)">✓ ${t("signed")}</b><button class="btn small ghost" onclick="book('${e.id}',false)">${t("cancel")}</button></div>`
     :`<button class="btn" ${left<=0?"disabled":""} onclick="book('${e.id}',true)">${left<=0?t("full"):t("signup")}</button>`}</div>`}).join("")},
 teas(){return `<h1>${t("new_in")}</h1>`+TEAS.map(x=>`<div class="card tea"><span class="pill">${L(x.type)}</span><h3>${x.name}</h3><div class="ru">${x.ru}</div></div>`).join("")+
  `<button class="btn ${S.notify?"ghost":""}" onclick="toggleNotify()">${S.notify?"✓ "+t("notify_on"):t("notify")}</button>`}
};
function sendCode(){const v=document.getElementById("ph").value.replace(/\s/g,"");if(v.length<9){toast(t("phone"));return}S.pending=v;S.step="code";save();render()}
function checkCode(){const v=document.getElementById("cd").value;if(!/^\d{4}$/.test(v)){toast(t("code_hint"));return}S.phone=S.pending;S.step="phone";S.tab="home";save();render()}
function logout(){S.phone=null;save();render()}
function today(){const d=new Date();return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")}
function buy(){S.points+=35;S.history.push({k:"purchase",v:35,d:today()});save();render();toast(t("earned")+": +35 "+t("pts"))}
function redeem(id){const r=REWARDS.find(x=>x.id==id);if(S.points<r.cost)return;S.points-=r.cost;S.history.push({k:"reward",v:-r.cost,d:today()});save();render();toast(t("redeemed")+": "+L(r.name))}
function book(id,on){if(on)S.booked[id]=true;else delete S.booked[id];save();render();toast(on?t("signed_ok"):t("cancel_ok"))}
function toggleNotify(){S.notify=!S.notify;save();render()}
function render(){document.body.classList.toggle("out",!S.phone);langs();document.getElementById("view").innerHTML=S.phone?V[S.tab]():V.login();nav()}
render();
</script>
</body>
</html>
